[project]
site_name = "Godot Google Play Billing"
site_description = "Godot Android plugin for Google Play Billing."
site_author = "syntaxerror247"
repo_url = "https://github.com/godot-sdk-integrations/godot-google-play-billing"
repo_name = "GodotGooglePlayBilling"
copyright = "Copyright &copy; 2020 Godot Engine Contributors"

use_directory_urls = false
edit_uri  = "edit/master/docs/"

nav = [
  "index.md",
  "Installation.md",
  "quickstart.md"
]

[project.theme]
language = "en"
favicon = "https://godotengine.org/assets/press/icon_color.svg"
logo = "https://godotengine.org/assets/press/icon_color.svg"


features = [
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "navigation.footer",
  "navigation.instant",
  "navigation.instant.progress",
  "navigation.top",
  "search.highlight",
  "content.action.edit",
  "content.action.view"
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"
media = "(prefers-color-scheme: light)"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"
media = "(prefers-color-scheme: dark)"

[project.markdown_extensions.admonition]
[project.markdown_extensions.tables]
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.snippets]
[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"

[project.markdown_extensions.toc]
toc_depth = 0

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true